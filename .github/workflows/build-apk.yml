name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build VidyaSetu Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Initialize Android Project
        working-directory: ./flutter_app
        run: |
          flutter create --org com.vidyasetu.school --project-name school_parent_app .
          flutter pub get

      - name: Build APK (Universal Debug & Release)
        working-directory: ./flutter_app
        run: |
          # Build installable debug APK that requires no keystore setup
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../VidyaSetu-Parent-App.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidyaSetu-Parent-App-APK
          path: VidyaSetu-Parent-App.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "VidyaSetu Parent App v1.0.0 APK"
          body: "Official Android APK for VidyaSetu School Parent & Teacher Mobile App. Tap to download and install on any Android phone."
          files: VidyaSetu-Parent-App.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
