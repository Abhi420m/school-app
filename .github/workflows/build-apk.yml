name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build VidyaSetu Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Initialize Android Native Project
        working-directory: ./flutter_app
        run: |
          flutter create --org com.vidyasetu.school --project-name school_parent_app .
          flutter pub get

      - name: Build Android Release APK
        working-directory: ./flutter_app
        run: |
          flutter build apk --release --split-per-abi=false

      - name: Rename APK
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk VidyaSetu-Parent-App.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidyaSetu-Parent-App-APK
          path: VidyaSetu-Parent-App.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "VidyaSetu Parent App APK Release v1.0.0"
          body: "Direct Android APK download for VidyaSetu School Parent & Teacher Mobile App."
          files: VidyaSetu-Parent-App.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
